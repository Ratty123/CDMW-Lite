name: Archive Lite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Focused Debug gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify and test
        shell: pwsh
        run: .\scripts\test_archive_lite.ps1 -Configuration Debug

  package:
    name: Native x64 Release package
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify, test, and package
        shell: pwsh
        run: .\scripts\build_archive_lite.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: CDMW-Archive-Lite-win-x64
          path: artifacts/CDMW-Archive-Lite-*-win-x64.zip
          if-no-files-found: error
